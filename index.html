<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Simple PWA</title>

  <!-- Link to CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Link to manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color for mobile browser UI -->
  <meta name="theme-color" content="#2196f3" />
</head>
<body>
  <header>
    <h1>My Simple PWA</h1>
  </header>

  <main>
    <p>This is a simple Progressive Web App.</p>
    <button id="clickMe">Tap me</button>
    <p id="output"></p>

    <section class="camera-section" aria-labelledby="camera-title">
      <h2 id="camera-title">Take a picture</h2>
      <button id="cameraButton" type="button">Open camera</button>
      <div id="cameraView" hidden>
        <video id="cameraVideo" autoplay playsinline aria-label="Live camera preview"></video>
        <button id="captureButton" type="button">Take picture</button>
        <button id="closeCameraButton" type="button">Close camera</button>
      </div>
      <p id="cameraStatus" role="status" aria-live="polite"></p>
      <img id="photoPreview" alt="Your captured picture" hidden />
    </section>
  </main>

  <!-- App logic -->
  <script src="app.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .then(reg => console.log('Service worker registered', reg))
          .catch(err => console.log('Service worker registration failed', err));
      });
    }
  </script>
</body>
</html>
