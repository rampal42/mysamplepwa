<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whats this ?</title>

  <!-- Link to CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Link to manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color for mobile browser UI -->
  <meta name="theme-color" content="#2196f3" />
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Whats in this Picture ?</h1>
      <button id="settingsButton" class="icon-button" type="button" aria-label="Settings" aria-expanded="false">&#9881;</button>
    </div>
    <div id="settingsPanel" class="settings-panel" hidden>
      <label for="apiKeyInput">OpenRouter API key</label>
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Enter your API key" />
      <p class="settings-note">Your key is stored only in this browser.</p>
    </div>
  </header>

  <main>
    <section class="camera-section" aria-labelledby="camera-title">
      <h2 id="camera-title">Take a picture</h2>
      <div class="camera-controls">
        <button id="cameraButton" type="button">Start Camera</button>
        <button id="captureButton" type="button" hidden>Take picture</button>
        <button id="describeButton" type="button" hidden>Describe picture</button>
        <button id="switchCameraButton" type="button" hidden>Use front camera</button>
        <button id="closeCameraButton" type="button" hidden>Close camera</button>
      </div>
      <label class="prompt-label" for="promptInput">Prompt</label>
      <textarea id="promptInput" rows="3" placeholder="Describe this image clearly and concisely.">Describe this image clearly and concisely.</textarea>
      <div id="cameraView" hidden>
        <video id="cameraVideo" autoplay playsinline aria-label="Live camera preview"></video>
      </div>
      <p id="cameraStatus" role="status" aria-live="polite"></p>
      <img id="photoPreview" alt="Your captured picture" hidden />
      <p id="description" aria-live="polite"></p>
    </section>
  </main>

  <!-- App logic -->
  <script src="app.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const hadController = Boolean(navigator.serviceWorker.controller);
        if (hadController) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
          }, { once: true });
        }

        navigator.serviceWorker
          .register('./service-worker.js', { updateViaCache: 'none' })
          .then(reg => {
            reg.update();
            console.log('Service worker registered', reg);
          })
          .catch(err => console.log('Service worker registration failed', err));
      });
    }
  </script>
</body>
</html>
